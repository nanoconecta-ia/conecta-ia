name: Painel (GitHub Pages)

on:
  workflow_dispatch:
  # Um único release por evento: só dispara se o arquivo de autorização desta data for ADICIONADO na main.
  # Commits de código comuns não fazem deploy automático.
  push:
    branches: [main]
    paths:
      - '.github/releases/painel-publicacao-unica-20261029.md'
      # Autorização pontual do proprietário: revisão visual MCP de fotos e banners.
      - '.github/releases/painel-midia-mcp-20261119.md'
      # Implantação pontual autorizada: separar instalação/navegação PWA do Conecta e loja.
      - '.github/releases/painel-pwa-independente-20261119.md'
      # Autorização pontual do proprietário para painel de conectores multiagente, sem alterações do backend.
      - '.github/releases/painel-conectores-multiagente-20261119.md'
      # Autorização pontual: consolidar as sessões OAuth antigas do conector ChatGPT MCP.
      - '.github/releases/painel-mcp-identidade-unica-20261119.md'
      # Autorização pontual do lojista em 20/11/2026: aplicar Técnico e disponibilizar Oficial/Impacto.
      - '.github/releases/mobis-modelos-modulares-20261120.md'
      # Nova autorização do lojista: destaque branco do favicon MA sem editar logo nem produtos.
      - '.github/releases/mobis-favicon-ma-branco-20261120.md'
      # Autorização de entrega real: primeira dobra do Modelo 02, sem liberar catálogo não aprovado.
      - '.github/releases/mobis-modelo02-entrega-real-20261120.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # O pareamento por QR (Conecta Pair) já está em produção (funções pair e conecta-gateway; migrações conecta_pair e oauth_agente).
          # Sem esta flag o painel publicado esconde Aprovações, Dispositivos e o QR. Igual aos workflows de publicação pontual.
          VITE_PAIR_ATIVO: '1'
          # Backup do cadastro do Bling (migração bling_snapshots e função bling-backup já em produção). Sem a flag a tela /backup fica oculta.
          VITE_BACKUP_ATIVO: '1'
          # Editor de banners Flash: migração de imagem_id e RPC validada no Supabase em 16/11/2026.
          # O editor só publica campanhas com produto aprovado; não cria estoque ou anúncios automaticamente.
          VITE_BANNERS_ATIVO: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.implantar.outputs.page_url }}
    steps:
      - id: implantar
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - name: Preparar homologação da loja publicada
        working-directory: painel
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Conferir commit e vitrine publicada sem cache
        run: node scripts/tests/loja-mobis-publicada.mjs
      - name: Conferir Conecta e Nano publicados (sessão e dados simulados)
        run: node scripts/tests/conecta-aprovado-visual.mjs
        env:
          WORKSPACE_BASE_URL: ${{ steps.implantar.outputs.page_url }}conecta.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobis-publicada-desktop-mobile
          path: evidencias-publicacao/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conecta-nano-publicado-SIMULADO
          path: evidencias-conecta-aprovado/
          retention-days: 7
          if-no-files-found: warn
