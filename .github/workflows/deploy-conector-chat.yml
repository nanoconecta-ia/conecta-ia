name: Deploy pontual da função conector-chat (Supabase conecta-ia)

# Publica a função `conector-chat` (PRIMEIRA publicação: a função ainda não existe em produção; depende das tabelas agente_* já aplicadas) a partir do main. NUNCA roda sozinho: só por disparo manual, com a frase de confirmação.
# Precisa do segredo SUPABASE_ACCESS_TOKEN no GitHub (criado pelo dono; o token nunca aparece em log).
on:
  workflow_dispatch:
    inputs:
      confirmar:
        # Lista de escolha, não texto livre: assim ninguém consegue colar um segredo neste campo (o valor aparece em log público).
        description: 'Escolha publicar-conector-chat para publicar. NUNCA cole token ou senha em formulários deste workflow.'
        required: true
        type: choice
        default: nao-publicar
        options:
          - nao-publicar
          - publicar-conector-chat

permissions:
  contents: read

concurrency:
  group: deploy-conector-chat
  cancel-in-progress: false

env:
  # Projeto conecta-ia. O ref do NanoShell IA (ptilvkzuhjnqnfydjcly) NUNCA pode ser usado aqui.
  PROJECT_REF: dsfzhsrudriqkumtlqwj

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Ambiente de produção: configure em Settings > Environments > producao-assistente os revisores obrigatórios
    # (só o dono publica). Sem aprovação do revisor, o job não começa.
    environment: producao-assistente
    steps:
      - name: Travas de segurança
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          REF_NAME: ${{ github.ref_name }}
          TOKEN_OK: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          test "$CONFIRMAR" = "publicar-conector-chat" || { echo "Frase de confirmação incorreta"; exit 1; }
          test "$REF_NAME" = "main" || { echo "Só a partir do main"; exit 1; }
          test "$PROJECT_REF" = "dsfzhsrudriqkumtlqwj" || exit 1
          test "$PROJECT_REF" != "ptilvkzuhjnqnfydjcly" || exit 1
          test "$TOKEN_OK" = "true" || { echo "Segredo SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Testes das funções
        run: |
          node --experimental-strip-types --test supabase/functions/_shared/*.test.ts supabase/functions/_shared/*/*.test.ts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Registrar a versão ANTES (primeira publicação, a função não deve existir ainda)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref "$PROJECT_REF" -o json > antes.json
          VERSAO_ANTES=$(jq -r '[.[] | select(.slug=="conector-chat") | .version] | first // 0' antes.json)
          echo "VERSAO_ANTES=$VERSAO_ANTES" >> "$GITHUB_ENV"
          echo "antes versao=$VERSAO_ANTES commit=$GITHUB_SHA"
          if [ "$VERSAO_ANTES" != "0" ]; then
            mkdir -p backup-antes && cd backup-antes
            supabase functions download conector-chat --project-ref "$PROJECT_REF" --use-api
            test -n "$(find . -type f | head -1)" || { echo "Backup vazio"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: conector-chat-antes-versao-anterior
          path: antes.json
          retention-days: 90
      - name: Publicar a função conector-chat (verify_jwt ligado, empacotamento no servidor)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy conector-chat --project-ref "$PROJECT_REF" --use-api
      - name: Registrar a versão DEPOIS (deve estar ACTIVE e com versão maior)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref "$PROJECT_REF" -o json > depois.json
          jq -e '.[] | select(.slug=="conector-chat" and .status=="ACTIVE")' depois.json > /dev/null || { echo "Função não está ACTIVE"; exit 1; }
          VERSAO_DEPOIS=$(jq -r '.[] | select(.slug=="conector-chat") | .version' depois.json)
          echo "depois versao=$VERSAO_DEPOIS commit=$GITHUB_SHA"
          test "$VERSAO_DEPOIS" -gt "$VERSAO_ANTES" || { echo "A versão não avançou"; exit 1; }
      - name: Prova de que o JWT continua exigido (sem token deve ser recusado)
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/conector-chat" -H 'content-type: application/json' -d '{}')
          echo "sem token HTTP $codigo"
          test "$codigo" = "401"
      - name: Como voltar atrás
        run: |
          echo "Primeira publicação: não há versão anterior. Para desfazer, desative a função no painel do Supabase (nenhum dado muda)."
          echo "A tela do chat só aparece no painel com VITE_CONECTOR_ATIVO=1, ainda desligado: a função fica sem uso até o dono ligar."
