name: Deploy pontual da função assistente (Supabase conecta-ia)

# Publica a função `assistente` a partir do main. NUNCA roda sozinho: só por disparo manual, com a frase de confirmação.
# Precisa do segredo SUPABASE_ACCESS_TOKEN no GitHub (criado pelo dono; o token nunca aparece em log).
on:
  workflow_dispatch:
    inputs:
      confirmar:
        # Lista de escolha, não texto livre: assim ninguém consegue colar um segredo neste campo (o valor aparece em log público).
        description: 'Escolha publicar-assistente para publicar. NUNCA cole token ou senha em formulários deste workflow.'
        required: true
        type: choice
        default: nao-publicar
        options:
          - nao-publicar
          - publicar-assistente

permissions:
  contents: read

concurrency:
  group: deploy-assistente
  cancel-in-progress: false

env:
  # Projeto conecta-ia. O ref do NanoShell IA (ptilvkzuhjnqnfydjcly) NUNCA pode ser usado aqui.
  PROJECT_REF: dsfzhsrudriqkumtlqwj

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Ambiente de produção: configure em Settings > Environments > producao-assistente os revisores obrigatórios
    # (só o dono publica). Sem aprovação do revisor, o job não começa.
    environment: producao-assistente
    steps:
      - name: Travas de segurança
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          REF_NAME: ${{ github.ref_name }}
          TOKEN_OK: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          test "$CONFIRMAR" = "publicar-assistente" || { echo "Frase de confirmação incorreta"; exit 1; }
          test "$REF_NAME" = "main" || { echo "Só a partir do main"; exit 1; }
          test "$PROJECT_REF" = "dsfzhsrudriqkumtlqwj" || exit 1
          test "$PROJECT_REF" != "ptilvkzuhjnqnfydjcly" || exit 1
          test "$TOKEN_OK" = "true" || { echo "Segredo SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Testes das funções e pacote autocontido atualizado
        run: |
          node --experimental-strip-types --test supabase/functions/_shared/*.test.ts supabase/functions/_shared/*/*.test.ts
          node --experimental-vm-modules scripts/gerar-autocontido.mjs --check
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Registrar a versão ANTES e guardar o código publicado (base do rollback)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref "$PROJECT_REF" -o json > antes.json
          jq -e '.[] | select(.slug=="assistente")' antes.json > /dev/null || { echo "Função assistente não encontrada"; exit 1; }
          VERSAO_ANTES=$(jq -r '.[] | select(.slug=="assistente") | .version' antes.json)
          echo "VERSAO_ANTES=$VERSAO_ANTES" >> "$GITHUB_ENV"
          echo "antes versao=$VERSAO_ANTES commit=$GITHUB_SHA"
          mkdir -p backup-antes && cd backup-antes
          supabase functions download assistente --project-ref "$PROJECT_REF" --use-api
          test -n "$(find . -type f | head -1)" || { echo "Backup vazio"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: assistente-antes-versao-anterior
          path: |
            backup-antes
            antes.json
          retention-days: 90
      - name: Publicar a função assistente (verify_jwt ligado, empacotamento no servidor)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy assistente --project-ref "$PROJECT_REF" --use-api
      - name: Registrar a versão DEPOIS (deve estar ACTIVE e com versão maior)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref "$PROJECT_REF" -o json > depois.json
          jq -e '.[] | select(.slug=="assistente" and .status=="ACTIVE")' depois.json > /dev/null || { echo "Função não está ACTIVE"; exit 1; }
          VERSAO_DEPOIS=$(jq -r '.[] | select(.slug=="assistente") | .version' depois.json)
          echo "depois versao=$VERSAO_DEPOIS commit=$GITHUB_SHA"
          test "$VERSAO_DEPOIS" -gt "$VERSAO_ANTES" || { echo "A versão não avançou"; exit 1; }
      - name: Prova de que o JWT continua exigido (sem token deve ser recusado)
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/assistente" -H 'content-type: application/json' -d '{"acao":"chat_config"}')
          echo "sem token HTTP $codigo"
          test "$codigo" = "401"
      - name: Como voltar atrás
        run: |
          echo "Rollback controlado: o código da versão anterior está no artefato assistente-antes-versao-anterior (90 dias)."
          echo "Para voltar, reimplante esse código da função assistente (supabase functions deploy), sem reverter outras mudanças do main."
          echo "Depois do deploy, falta o smoke test autenticado com usuário de homologação (RLS, streaming, somente leitura), fora deste workflow."
