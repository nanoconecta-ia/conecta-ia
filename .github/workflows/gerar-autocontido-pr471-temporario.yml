name: PR 471 - regerar artefato autocontido sem deploy
on:
  push:
    branches:
      - feat/proposta-plugin-midias-produtos-banners
permissions:
  contents: write
jobs:
  regerar:
    if: github.repository == 'nanoconecta-ia/conecta-ia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/proposta-plugin-midias-produtos-banners
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Gerar somente os artefatos do assistente
        run: node --experimental-vm-modules scripts/gerar-autocontido.mjs
      - name: Checar idempotencia do gerador
        run: node --experimental-vm-modules scripts/gerar-autocontido.mjs --check
      - name: Commit de artefatos na branch da proposta
        run: |
          git add artifacts/assistente/index.ts artifacts/assistente/manifesto.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sincronizar artefato autocontido do assistente"
          git push origin HEAD:refs/heads/feat/proposta-plugin-midias-produtos-banners
