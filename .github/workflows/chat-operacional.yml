name: Chat operacional - validação sem produção
on:
  pull_request:
    paths: ['supabase/**', 'scripts/**', 'painel/**', 'sql/**', '.github/workflows/chat-operacional.yml']
permissions:
  contents: read
concurrency:
  group: chat-operacional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contrato-migracao:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.81.3
      - name: Gerar nome com CLI oficial (somente diretório temporário)
        if: hashFiles('supabase/migrations/*_chat_operacional.sql') == ''
        run: |
          supabase --help
          supabase migration new --help
          mkdir -p "$RUNNER_TEMP/chat-migracao"
          supabase init --workdir "$RUNNER_TEMP/chat-migracao"
          supabase migration new chat_operacional --workdir "$RUNNER_TEMP/chat-migracao"
          for arquivo in "$RUNNER_TEMP"/chat-migracao/supabase/migrations/*_chat_operacional.sql; do
            echo "MIGRACAO_GERADA=$(basename "$arquivo")"
          done

  artefato-e-oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - run: node --experimental-vm-modules scripts/gerar-autocontido.mjs --check
      - run: node --experimental-vm-modules scripts/tests/chat-artefato.test.mjs
      - run: node --experimental-vm-modules scripts/tests/oauth-operacional.test.mjs

  demonstracao-390px:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - run: npm ci
        working-directory: painel
      - name: Navegador efêmero, sem alterar dependências do produto
        working-directory: painel
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - run: node scripts/tests/chat-visual.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chat-390px-SIMULADO
          path: evidencias-chat/chat-390-simulado.png
          retention-days: 7
          if-no-files-found: error
