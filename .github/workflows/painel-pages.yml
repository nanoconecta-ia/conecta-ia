name: Painel (GitHub Pages)

on:
  workflow_dispatch:
  # Um único release por evento: só dispara se o arquivo de autorização desta data for ADICIONADO na main.
  # Commits de código comuns não fazem deploy automático.
  push:
    branches: [main]
    paths:
      - '.github/releases/painel-publicacao-unica-20261029.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # O pareamento por QR (Conecta Pair) já está em produção (funções pair e conecta-gateway; migrações conecta_pair e oauth_agente).
          # Sem esta flag o painel publicado esconde Aprovações, Dispositivos e o QR. Igual aos workflows de publicação pontual.
          VITE_PAIR_ATIVO: '1'
          # Backup do cadastro do Bling (migração bling_snapshots e função bling-backup já em produção). Sem a flag a tela /backup fica oculta.
          VITE_BACKUP_ATIVO: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.implantar.outputs.page_url }}
    steps:
      - id: implantar
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - name: Preparar homologação da loja publicada
        working-directory: painel
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Conferir commit e vitrine publicada sem cache
        run: node scripts/tests/loja-mobis-publicada.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobis-publicada-desktop-mobile
          path: evidencias-publicacao/
          retention-days: 7
          if-no-files-found: warn
