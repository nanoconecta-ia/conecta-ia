name: Painel (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: painel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # O pareamento por QR (Conecta Pair) já está em produção (funções pair e conecta-gateway; migrações conecta_pair e oauth_agente).
          # Sem esta flag o painel publicado esconde Aprovações, Dispositivos e o QR. Igual aos workflows de publicação pontual.
          VITE_PAIR_ATIVO: '1'
          # Backup do cadastro do Bling (migração bling_snapshots e função bling-backup já em produção). Sem a flag a tela /backup fica oculta.
          VITE_BACKUP_ATIVO: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantar.outputs.page_url }}
    steps:
      - id: implantar
        uses: actions/deploy-pages@v4
