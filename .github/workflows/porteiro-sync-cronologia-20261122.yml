name: Sincronizar artefatos porteiro (somente PR)
on:
  push:
    branches: ['codex/porteiro-multiaplicacao-20261121']
    paths: ['.github/workflows/porteiro-sync-cronologia-20261122.yml']
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/porteiro-multiaplicacao-20261121
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Regenerar pacotes determinísticos sem publicar
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-vm-modules scripts/gerar-autocontido.mjs
          node --experimental-vm-modules scripts/gerar-pair.mjs
          git add artifacts/assistente artifacts/conecta-gateway artifacts/pair
          if git diff --cached --quiet; then
            echo "Artefatos já estão sincronizados"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(porteiro): sincronizar pacotes de cronologia sem produção"
          git push origin HEAD:codex/porteiro-multiaplicacao-20261121
