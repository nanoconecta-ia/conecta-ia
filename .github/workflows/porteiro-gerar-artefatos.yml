name: Porteiro - regenerar artefatos no ramo de revisao
on:
  push:
    branches: [codex/porteiro-multiaplicacao-20261121]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    if: github.repository == 'nanoconecta-ia/conecta-ia' && github.ref == 'refs/heads/codex/porteiro-multiaplicacao-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Gerar SOMENTE artefatos locais (sem publicar)
        run: node --experimental-vm-modules scripts/gerar-pair.mjs
      - name: Registrar artefatos no proprio ramo de revisao
        run: |
          git add artifacts/pair/index.ts artifacts/pair/manifesto.json artifacts/conecta-gateway/index.ts artifacts/conecta-gateway/manifesto.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(review): sincronizar artefatos autocontidos do gateway"
            git push origin HEAD:codex/porteiro-multiaplicacao-20261121
          fi
