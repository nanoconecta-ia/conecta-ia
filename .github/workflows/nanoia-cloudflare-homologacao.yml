name: NanoIA Cloudflare - homologacao manual e descartavel
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "SHA completo (40 caracteres) do PR #153 com 9 fluxos verdes"
        required: true
        type: string
      autorizar_custos:
        description: "Confirma Workers Paid e autoriza gastos do teste sob seu controle?"
        required: true
        type: choice
        default: NAO
        options:
          - NAO
          - SIM

permissions:
  contents: read
  actions: read

concurrency:
  group: nanoia-cloudflare-homologacao
  cancel-in-progress: false

jobs:
  preflight-sem-cloudflare:
    if: ${{ github.repository == 'nanoconecta-ia/conecta-ia' && inputs.autorizar_custos == 'SIM' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/nanoia-codemode
    env:
      TARGET_SHA: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Confirmar SHA completo da branch autorizada
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          remoto="$(git ls-remote origin refs/heads/feat/gpt-workspace-core-20261030 | cut -f1)"
          test "$remoto" = "$TARGET_SHA"
      - name: Revalidar todos os nove fluxos CI no commit exato
        run: node staging/validar-revisao.mjs
      - name: Instalar dependencias travadas e revalidar contratos
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/bridge-auth.test.mjs
      - name: Criar nomes exclusivos sem deploy
        shell: bash
        run: node staging/preparar-plano.mjs "$GITHUB_RUN_ID"
      - name: Compilar host e pai de staging, sem tocar Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy -c "staging/.run-${GITHUB_RUN_ID}-host.jsonc" --dry-run
          npx wrangler deploy -c "staging/.run-${GITHUB_RUN_ID}-pai.jsonc" --dry-run

  cloudflare-staging-controlado:
    needs: preflight-sem-cloudflare
    # Exigir aprovação manual do ambiente e segredos SOMENTE de homologação.
    # NUNCA acionar automaticamente após pull_request/push/merge.
    environment:
      name: cloudflare-homologacao
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/nanoia-codemode
    env:
      TARGET_SHA: ${{ inputs.revision }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Validar credenciais e destino antes de publicar qualquer coisa
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$CLOUDFLARE_ACCOUNT_ID" = "76ead64847b165d46877d94720d5b0ff"
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_WORKERS_SUBDOMAIN" =~ ^[a-z0-9-]{3,63}$ ]]
          # Conta e identidade de hospedagem fixas; nenhum domínio comercial.
      - name: Instalar dependencias SEM executar scripts externos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Criar configuracoes de workers unicos e segredos temporarios
        shell: bash
        run: |
          set -euo pipefail
          node staging/preparar-plano.mjs "$GITHUB_RUN_ID"
          node staging/gerar-segredos.mjs "$GITHUB_RUN_ID"
      - name: Implantar somente host privado de homologacao
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy -c "staging/.run-${GITHUB_RUN_ID}-host.jsonc" \
            --secrets-file "staging/.run-${GITHUB_RUN_ID}-host-secrets.json"
      - name: Implantar somente Worker pai com bearer de teste
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy -c "staging/.run-${GITHUB_RUN_ID}-pai.jsonc" \
            --secrets-file "staging/.run-${GITHUB_RUN_ID}-pai-secrets.json"
      - name: Testar publicacao hospedada com duas lojas ficticias
        shell: bash
        run: |
          set -euo pipefail
          export NANOIA_HML_URL="https://nanoia-hml-pai-${GITHUB_RUN_ID}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev/mcp"
          node staging/teste-hospedado.mjs
      - name: Excluir APENAS os Workers unicos desta execucao, mesmo em falha
        if: always()
        shell: bash
        run: |
          set +e
          # Deletar pai antes de host, para desconectar o Service Binding.
          for tipo in pai host; do
            conf="staging/.run-${GITHUB_RUN_ID}-${tipo}.jsonc"
            if test -f "$conf" && test -n "$CLOUDFLARE_API_TOKEN" && test "$CLOUDFLARE_ACCOUNT_ID" = "76ead64847b165d46877d94720d5b0ff"; then
              printf 'y\n' | timeout 70s npx wrangler delete -c "$conf" || echo "AVISO: revisar exclusao manual do worker efemero: $tipo"
            fi
          done
          rm -f "staging/.run-${GITHUB_RUN_ID}-"* 2>/dev/null
          echo "Limpeza do runner encerrada. Confirmar no painel se recursos persistentes permanecem."
