name: Publicação pontual do consentimento OAuth do agente
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publicar-oauth-agente.yml']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Publica somente o snapshot revisado e autorizado do estúdio.
    # Depois deste merge, a condição fica falsa: não reativa deploy automático.
    if: github.event.before == 'b03ed032d47b4b6656db976c0ff41aacaa3882f8'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Conferir runner gratuito e repositório público
        env:
          PUBLICO: ${{ github.event.repository.private == false }}
        run: |
          test "$PUBLICO" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = X64
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: painel/package-lock.json
      - run: npm ci
        working-directory: painel
      - run: npm test
        working-directory: painel
      - run: npm run build
        env:
          VITE_PAIR_ATIVO: '1'
        working-directory: painel
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.implantar.outputs.page_url }}
    steps:
      - id: implantar
        uses: actions/deploy-pages@v4
