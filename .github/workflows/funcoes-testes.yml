name: Testes das funções e do banco

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/funcoes-testes.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/funcoes-testes.yml"]

permissions:
  contents: read

jobs:
  funcoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Só testes puros (sem rede, sem Supabase, sem segredo). Deploy não faz parte deste fluxo.
      - run: node --experimental-strip-types --test supabase/functions/_shared/*.test.ts supabase/functions/_shared/*/*.test.ts

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # Banco DESCARTÁVEL do runner (nunca o Supabase). Aplica stub + migrações e roda os testes SQL do Conecta Pair.
      - run: ./supabase/tests/rodar_local.sh
      - name: Homologar minuta Nano Lifecycle no PostgreSQL descartável
        env:
          PGDATABASE: conecta_teste
        run: |
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-persistencia-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-persistencia-TESTE.sql
          bash supabase/tests/nano_lifecycle_concorrencia.sh
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-reserva-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-reserva-TESTE.sql
          bash supabase/tests/nano_lifecycle_reserva_concorrencia.sh
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-projecao-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-ausencias-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-ausencias-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-finalizacao-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-finalizacao-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-lote-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-lote-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-espelho-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-espelho-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-leitura-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-leitura-TESTE.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrar orquestrador e RPCs reais no PostgreSQL descartável
        env:
          PGDATABASE: conecta_teste
        run: node --experimental-strip-types scripts/tests/nano-lifecycle-e2e.mjs
      - run: ./supabase/tests/conecta_pair_concorrencia.sh
      - run: ./supabase/tests/exec_local_concorrencia.sh
      - run: node scripts/tests/chat-concorrencia.mjs
      - run: node scripts/tests/chat-fila-concorrencia.mjs
      - name: Validar proteção de escritores e repetir E2E com trigger
        env:
          PGDATABASE: conecta_teste
        run: |
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-guard-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-papeis-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-guard-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-diario-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-eventos-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-diario-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-eventos-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-despacho-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-despacho-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-consumo-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-consumo-TESTE.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-transicoes-MINUTA.sql
          psql -Xq -v ON_ERROR_STOP=1 -f docs/conector-ia/nano-lifecycle-transicoes-TESTE.sql
          bash supabase/tests/nano_lifecycle_despacho_concorrencia.sh
          node --experimental-strip-types scripts/tests/nano-lifecycle-e2e.mjs
      - name: Validar reversão somente no banco descartável
        env:
          PGDATABASE: conecta_teste
        run: |
          psql -Xq -v ON_ERROR_STOP=1 -f docs/chat-operacional/REVERSAO.sql
          psql -XqAt -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if to_regclass('public.chat_fila') is not null or to_regprocedure('public.chat_fila_reivindicar(uuid)') is not null or to_regclass('public.conversas') is not null or to_regclass('public.mensagens') is not null or to_regclass('public.auditoria') is null then raise exception 'reversão inválida'; end if;
          end $$;
          SQL
